name: Checks

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax and patcher tests
        run: |
          python -m compileall -q art-server.py supervisor.py patch_source.py tests
          python -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh mpd-discord-art
